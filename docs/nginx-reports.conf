server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    auth_basic "MeiLin Reports - restricted";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Download endpoint: cho phep tai .html/.md ve may (Content-Disposition: attachment)
    # - .md KHONG xem truc tiep (404 o path thuong), CHI tai ve qua /download/
    # - Phai dat TRUOC regex 404 .md|css de thang theo thu tu regex
    location ~* ^/download/(.+\.(md|html))$ {
        root /usr/share/nginx/html;
        add_header Content-Disposition 'attachment; filename="$1"';
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/octet-stream;
        try_files /$1 =404;
    }

    location ~* \.(md|css)$ { return 404; }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
